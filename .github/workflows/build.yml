name: Build et tests

on:
  push:
    branches: [ "main", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer
        run: dotnet restore SlideStudio.sln

      - name: Compiler
        run: dotnet build SlideStudio.sln --no-restore --configuration Release

      - name: Restaurer les tests Infrastructure
        run: dotnet restore tests/SlideStudio.Infrastructure.Tests/SlideStudio.Infrastructure.Tests.csproj

      - name: Compiler les tests Infrastructure
        run: dotnet build tests/SlideStudio.Infrastructure.Tests/SlideStudio.Infrastructure.Tests.csproj --no-restore --configuration Release

      - name: Tests Core
        run: dotnet test tests/SlideStudio.Core.Tests/SlideStudio.Core.Tests.csproj --no-build --configuration Release

      - name: Tests Presenters
        run: dotnet test tests/SlideStudio.Presenters.Tests/SlideStudio.Presenters.Tests.csproj --no-build --configuration Release

      - name: Tests Infrastructure
        run: dotnet test tests/SlideStudio.Infrastructure.Tests/SlideStudio.Infrastructure.Tests.csproj --no-build --configuration Release

      - name: Tests UI
        run: dotnet test tests/SlideStudio.UI.Tests/SlideStudio.UI.Tests.csproj --no-build --configuration Release
